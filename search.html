<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DEMON</title>
    <script src="/service/uv/uv.bundle.js" defer></script>
    <script src="/service/uv/uv.config.js" defer></script>
    <script src="/service/register-sw.js" defer></script>
    <script src="/service/search.js" defer></script>
    <script src="/service/index.js" defer></script>
  </head>

  <body>
    <form id="uv-form" class="flex-center">
      <input
        id="uv-search-engine"
        value="https://duckduckgo.com/search?q=%s"
        type="hidden"
      />
      <input id="uv-address" type="text" placeholder="Search..." />
    </form>
    <div class="desc left-margin">
      <p id="uv-error"></p>
      <pre id="uv-error-code"></pre>
    </div>
   
    <iframe style="display: none;" id="uv-frame"></iframe>
  </body>
</html>
